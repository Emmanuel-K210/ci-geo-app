<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Culture Ivoire · présentation</title>
    <link rel="stylesheet" href="poster.css" />
    <link rel="stylesheet" href="scene.css" />
    <script src="demo.js"></script>
    <script src="scene.js"></script>
    <script src="data.js"></script>
  </head>
  <body>
    <!--
      Timed on the voice-over (audio/voix-presentation.mp3, started at 0.3 s):
      phrases at 0.4–2.05, 2.5–4.15, 4.45–9.55 and 9.9–10.65 s.
    -->

    <!-- 4.3 → 9.8 s: the phone with the real app -->
    <div data-in="4.3" data-out="9.8" data-fx="up" class="layer">
      <div
        class="phone"
        style="left: 220px; top: 400px; --w: 640px; --s: 1.5426"
      >
        <div class="screen">
          <iframe
            id="preload"
            src="/#/decouvrir/sites/tai"
            style="z-index: 0"
          ></iframe>
          <iframe
            id="app"
            src="/#/atlas?ville=ci-v-bouake"
            style="z-index: 1"
          ></iframe>
        </div>
      </div>
    </div>
    <div data-in="4.3" data-out="6.1" data-fx="left" class="caption">
      📍 Les 14 districts
      <small>sur une vraie carte, ville par ville</small>
    </div>
    <div data-in="6.1" data-out="7.9" data-fx="left" class="caption">
      📖 Nos peuples, nos sites
      <small>leur histoire, leurs photos</small>
    </div>
    <div data-in="7.9" data-out="9.8" data-fx="left" class="caption">
      🎮 10 jeux
      <small>et un défi chaque jour</small>
    </div>

    <!-- 0 → 2.4 s: the hook -->
    <div data-in="0" data-out="2.75" data-fadein="0.01" class="layer dark">
      <div class="bar">
        <div class="flag"><span></span><span></span><span></span></div>
      </div>
      <img
        src="carte.svg"
        alt=""
        style="
          position: absolute;
          left: 90px;
          top: 520px;
          width: 900px;
          opacity: 0.12;
        "
      />
      <div class="layer center" style="gap: 10px">
        <p data-in="0.1" data-fx="pop" class="big" style="font-size: 150px">
          Tu connais
        </p>
        <p data-in="0.5" data-fx="pop" class="big" style="font-size: 150px">
          vraiment
        </p>
        <p
          data-in="0.9"
          data-fx="pop"
          class="big accent"
          style="font-size: 132px"
        >
          la Côte d'Ivoire&nbsp;?
        </p>
      </div>
    </div>

    <!-- 2.4 → 4.4 s: the app -->
    <div data-in="2.4" data-out="4.4" data-fadein="0.2" class="layer dark">
      <div class="bar">
        <div class="flag"><span></span><span></span><span></span></div>
      </div>
      <div class="layer center">
        <div data-in="2.5" data-fx="zoom" class="brand">
          <img src="/logo-mark.svg" alt="" /><span
            >Culture <span class="accent">Ivoire</span></span
          >
        </div>
        <p
          data-in="2.9"
          data-fx="up"
          class="story"
          style="font-size: 60px; color: #eef2ee"
        >
          La Côte d'Ivoire<br />dans ta poche
        </p>
      </div>
    </div>

    <script>
      document.body.insertAdjacentHTML(
        "beforeend",
        endCard(9.8, "Joue au défi du jour")
      )
      const go = (hash) => (app("app").location.hash = hash)
      cue(5.2, () => go("#/atlas?district=ci-d-savanes"))
      cue(6.1, () => go("#/decouvrir/sites/tai"))
      cue(7.9, () => go("#/jeux"))
      onFrame.push((t) => {
        const w = app("app")
        if (t >= 6.1 && t < 7.9) w.scrollTo(0, span(t, 6.5, 7.8) * 700)
        else if (t >= 7.9 && t < 9.8) w.scrollTo(0, span(t, 8.2, 9.7) * 600)
        else w.scrollTo(0, 0)
      })
      window.duration = 13.5
      window.audio = {
        voice: "voix-presentation.mp3",
        voiceAt: 0.3,
        music: true,
      }
    </script>
  </body>
</html>
