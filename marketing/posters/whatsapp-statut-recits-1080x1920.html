<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp statut récits</title>
    <link rel="stylesheet" href="poster.css" />
    <script src="demo.js"></script>
    <style>
      body {
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div style="position: absolute; inset: 0; background: #17241e"></div>
    <img
      class="map"
      src="carte.svg"
      style="left: -120px; top: 980px; width: 900px; opacity: 0.16"
      alt=""
    />
    <div style="position: absolute; inset: 0 0 auto 0; height: 14px">
      <div class="flag"><span></span><span></span><span></span></div>
    </div>
    <div
      style="
        position: absolute;
        left: 80px;
        right: 80px;
        top: 110px;
        display: flex;
        flex-direction: column;
        gap: 26px;
        color: #eef2ee;
      "
    >
      <div class="logo" style="font-size: 40px">
        <svg viewBox="0 0 34 34" aria-hidden="true">
          <path
            d="M17 3c-6 0-10.5 4.6-10.5 10.3C6.5 21 17 31 17 31s10.5-10 10.5-17.7C27.5 7.6 23 3 17 3Z"
            fill="#e0680a"
          />
          <circle cx="17" cy="13.3" r="4" fill="#fff" />
        </svg>
        CI-Geo
      </div>
      <p class="eyebrow" style="font-size: 26px; color: #4cc28b">Découvrir</p>
      <h1 class="display" style="font-size: 90px">
        Abla Pokou, Kong, Grand-Bassam…
        <span class="accent">les histoires</span> derrière les lieux.
      </h1>
      <p style="margin: 0; font-size: 32px; line-height: 1.4; opacity: 0.8">
        16 peuples, leurs origines et leurs traditions. 15 sites à visiter, avec
        leur récit et leurs photos.
      </p>
    </div>
    <div
      class="phone"
      style="
        left: 100px;
        top: 800px;
        --w: 400px;
        --s: 0.9641;
        transform: rotate(-5deg);
      "
    >
      <div class="screen">
        <iframe src="/#/decouvrir/peuples/baoule" scrolling="no"></iframe>
      </div>
    </div>
    <div
      class="phone"
      style="
        left: 580px;
        top: 850px;
        --w: 400px;
        --s: 0.9641;
        transform: rotate(5deg);
      "
    >
      <div class="screen">
        <iframe src="/#/decouvrir/sites/grand-bassam" scrolling="no"></iframe>
      </div>
    </div>
    <div
      style="
        position: absolute;
        left: 0;
        right: 0;
        bottom: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      "
    >
      <span
        class="cta"
        style="
          font-size: 38px;
          box-shadow: 0 20px 40px -18px rgba(0, 0, 0, 0.7);
        "
        >Lis le récit du jour</span
      >
      <p style="margin: 0; font-size: 22px; color: #9db0a5">
        Photos : Wikimedia Commons · Limites : geoBoundaries (CC BY 4.0)
      </p>
    </div>
  </body>
</html>
