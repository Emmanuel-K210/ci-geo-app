<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio · Culture Ivoire</title>
    <style>
      :root {
        --paper: #eef2ee;
        --surface: #ffffff;
        --ink: #17241e;
        --muted: #56675e;
        --line: #d3ddd5;
        --orange: #e0680a;
        --green: #0b7a4b;
        --green-soft: #e1f1e8;
        --warn: #fdf1e2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(238, 242, 238, 0.92);
        backdrop-filter: blur(8px);
      }
      header svg {
        width: 38px;
        height: 38px;
      }
      header b {
        font-size: 19px;
      }
      header b span {
        color: var(--orange);
      }
      header small {
        margin-left: 6px;
        color: var(--muted);
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        gap: 18px;
      }
      .card {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
      }
      h2 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      button {
        min-height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.orange {
        background: var(--orange);
      }
      button.ghost {
        background: var(--paper);
        color: var(--ink);
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      input,
      select {
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
      }
      input {
        flex: 1;
        min-width: 220px;
      }
      .muted {
        color: var(--muted);
      }
      .account img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
      }
      .notice {
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--warn);
        font-size: 14px;
      }
      .videos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
      }
      .video {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }
      .video video {
        width: 100%;
        aspect-ratio: 9 / 16;
        border-radius: 12px;
        background: #000;
      }
      .when {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
      }
      .badge {
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: var(--paper);
        color: var(--muted);
      }
      .badge.done {
        background: var(--green-soft);
        color: var(--green);
      }
      .badge.due {
        background: var(--warn);
        color: #8a4a00;
      }
      .caption {
        max-height: 88px;
        overflow: auto;
        font-size: 13px;
        color: var(--muted);
        white-space: pre-wrap;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        opacity: 0;
        transition: opacity 0.2s;
      }
      dialog {
        width: min(560px, calc(100% - 32px));
        max-height: calc(100% - 32px);
        padding: 0;
        border: 0;
        border-radius: 20px;
        background: var(--surface);
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgba(23, 36, 30, 0.5);
      }
      .sheet {
        display: grid;
        gap: 14px;
        padding: 20px;
      }
      .sheet h3 {
        margin: 0;
        font-size: 19px;
      }
      .sheet label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .sheet textarea {
        width: 100%;
        min-height: 110px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
        resize: vertical;
      }
      .sheet select {
        width: 100%;
      }
      .checks {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .checks label,
      .switch {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-weight: 500;
      }
      .sheet video {
        width: 140px;
        aspect-ratio: 9 / 16;
        border-radius: 10px;
        background: #000;
      }
      .legal {
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <svg viewBox="12 10 76 80" aria-hidden="true">
        <clipPath id="ci">
          <path
            d="M20.2,20.8L23.6,18.5L29.2,16.8L34.3,14L42.7,16.3L50.6,16.8L55.1,18.5L59.6,24.8L64.6,25.9L71.4,23.1L77.5,24.8L82,27.6L84.3,42.3L79.8,45.7L76.4,58.2L77.5,66.2L77.5,74.1L80.4,77.5L70.8,76.9L60.7,76.4L51.7,77.5L42.7,80.9L33.7,84.3L27.5,86L27.5,77.5L23.6,70.7L18,63.9L15.7,56L17.4,49.1L17.4,42.3L24.7,38.9L23,31L20.2,25.9Z"
          />
        </clipPath>
        <g clip-path="url(#ci)">
          <rect x="14.7" width="23.9" height="100" fill="#f77f00" />
          <rect x="38.6" width="22.9" height="100" fill="#fff" />
          <rect x="61.4" width="23.9" height="100" fill="#009e60" />
        </g>
        <path
          d="M20.2,20.8L23.6,18.5L29.2,16.8L34.3,14L42.7,16.3L50.6,16.8L55.1,18.5L59.6,24.8L64.6,25.9L71.4,23.1L77.5,24.8L82,27.6L84.3,42.3L79.8,45.7L76.4,58.2L77.5,66.2L77.5,74.1L80.4,77.5L70.8,76.9L60.7,76.4L51.7,77.5L42.7,80.9L33.7,84.3L27.5,86L27.5,77.5L23.6,70.7L18,63.9L15.7,56L17.4,49.1L17.4,42.3L24.7,38.9L23,31L20.2,25.9Z"
          fill="none"
          stroke="#17241e"
          stroke-width="2"
        />
      </svg>
      <b>Culture <span>Ivoire</span></b>
      <small>Studio TikTok</small>
    </header>

    <main>
      <section class="card">
        <h2>Compte TikTok</h2>
        <div id="account" class="muted">Chargement…</div>
      </section>

      <section class="card">
        <div class="row" style="justify-content: space-between">
          <h2 style="margin: 0">Vidéos du lot</h2>
          <select id="lot" aria-label="Lot de vidéos"></select>
        </div>
        <p class="muted" style="margin: 8px 0 14px">
          Chaque vidéo a sa date, son heure (heure d'Abidjan) et sa légende. «
          Publier » l'envoie sur le compte connecté ; « Copier la légende » sert
          si vous programmez dans TikTok Studio.
        </p>
        <div id="videos" class="videos"></div>
      </section>
    </main>
    <dialog id="publish">
      <form method="dialog" class="sheet" id="sheet"></form>
    </dialog>
    <div id="toast"></div>

    <script>
      const $ = (id) => document.getElementById(id)
      const fmt = (iso) =>
        new Date(iso).toLocaleString("fr-FR", {
          weekday: "short",
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          timeZone: "UTC",
        })

      function toast(text) {
        $("toast").textContent = text
        $("toast").style.opacity = 1
        clearTimeout(toast.timer)
        toast.timer = setTimeout(() => ($("toast").style.opacity = 0), 2600)
      }

      async function call(path, body) {
        const response = await fetch(path, {
          method: body ? "POST" : "GET",
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
        })
        const data = await response.json()
        if (!response.ok) throw new Error(data.error ?? "Erreur")
        return data
      }

      function renderAccount(state) {
        const box = $("account")
        const user = state.user
        if (state.connected && user && !user.error) {
          box.className = "row account"
          box.innerHTML = `
            ${user.avatar_url ? `<img src="${user.avatar_url}" alt="">` : ""}
            <div><b>${user.display_name}</b><br><span class="muted">Connecté : les vidéos seront publiées sur ce compte.</span></div>
            <button class="ghost" id="reconnect" style="margin-left:auto">Changer de compte</button>`
          $("reconnect").onclick = startLogin
          return
        }
        box.className = ""
        box.innerHTML = `
          <p class="muted" style="margin-top:0">${
            user?.error
              ? `La connexion a expiré ou a été retirée (${user.error}).`
              : "Aucun compte connecté."
          }</p>
          <div class="row">
            <button class="orange" id="login">1. Connecter le compte TikTok</button>
          </div>
          <div class="row" style="margin-top:10px">
            <input id="code" placeholder="2. Collez ici le code affiché après l'autorisation" autocomplete="off">
            <button id="validate">Valider</button>
          </div>`
        $("login").onclick = startLogin
        $("validate").onclick = async () => {
          const code = $("code").value
          if (!code.trim()) return toast("Collez d'abord le code")
          $("validate").disabled = true
          try {
            await call("/api/code", { code })
            toast("Compte connecté")
            load()
          } catch (error) {
            toast(error.message)
            $("validate").disabled = false
          }
        }
      }

      async function startLogin() {
        const { url } = await call("/api/login", {})
        window.open(url, "_blank")
        toast("Autorisez dans l'onglet TikTok, puis collez le code ici")
        if (!$("code")) renderAccount({ connected: false })
      }

      async function renderLot(lot) {
        const { rows } = await call(`/api/lot?lot=${lot}`)
        const now = Date.now()
        $("videos").innerHTML = rows
          .map((row, i) => {
            const done = row.published
            const due = !done && new Date(row.at).getTime() <= now
            const badge = done
              ? `<span class="badge done">Publiée${done.privacy === "SELF_ONLY" ? " · privée" : ""}</span>`
              : !row.exists
                ? `<span class="badge">Pas encore fabriquée</span>`
                : due
                  ? `<span class="badge due">À publier</span>`
                  : `<span class="badge">Programmée</span>`
            return `
              <article class="video">
                <div class="when"><span>${fmt(row.at)}</span>${badge}</div>
                ${
                  row.exists
                    ? `<video src="/video/${lot}/${row.file}#t=1" preload="metadata" controls muted></video>`
                    : `<div class="notice" style="aspect-ratio:9/16;display:grid;place-items:center;text-align:center">Vidéo pas encore fabriquée</div>`
                }
                <div class="caption">${row.caption.replace(/</g, "&lt;")}</div>
                <div class="row">
                  <button class="ghost" data-copy="${i}">Copier la légende</button>
                  <button data-post="${i}" ${done || !row.exists ? "disabled" : ""}>${done ? "Déjà publiée" : "Publier"}</button>
                </div>
              </article>`
          })
          .join("")
        $("videos").onclick = async (event) => {
          const copy = event.target.dataset.copy
          const post = event.target.dataset.post
          if (copy !== undefined) {
            await navigator.clipboard.writeText(rows[copy].caption)
            toast("Légende copiée")
          }
          if (post !== undefined) openPublish(lot, rows[post])
        }
      }

      // The posting screen, following TikTok's rules for Direct Post: the
      // account it goes to, a privacy level chosen by the user (no default),
      // interactions allowed by the user, commercial content disclosure,
      // and TikTok's consent text.
      const PRIVACY = {
        PUBLIC_TO_EVERYONE: "Tout le monde",
        MUTUAL_FOLLOW_FRIENDS: "Amis (abonnés mutuels)",
        FOLLOWER_OF_CREATOR: "Abonnés",
        SELF_ONLY: "Moi uniquement",
      }
      const MUSIC =
        "https://www.tiktok.com/legal/page/global/music-usage-confirmation/en"
      const BRANDED = "https://www.tiktok.com/legal/page/global/bc-policy/en"

      async function openPublish(lot, row) {
        const dialog = $("publish")
        const sheet = $("sheet")
        sheet.innerHTML = `<p class="muted">Chargement des réglages du compte…</p>`
        dialog.showModal()
        let creator
        try {
          creator = await call("/api/creator")
        } catch (error) {
          sheet.innerHTML = `<p class="notice"></p><div class="row"><button value="cancel" class="ghost">Fermer</button></div>`
          sheet.querySelector(".notice").textContent = error.message
          return
        }
        const off = (flag) => (flag ? "disabled" : "")
        sheet.innerHTML = `
          <h3>Publier sur TikTok</h3>
          <div class="row account">
            <img src="${creator.creator_avatar_url}" alt="" style="width:40px;height:40px;border-radius:50%">
            <div><b>${creator.creator_nickname}</b><br><span class="muted">@${creator.creator_username}</span></div>
          </div>
          <div class="row" style="align-items:flex-start">
            <video src="/video/${lot}/${row.file}" controls muted preload="metadata"></video>
            <div style="flex:1;min-width:200px">
              <label for="p-caption">Légende</label>
              <textarea id="p-caption" maxlength="2200"></textarea>
              <span class="muted" id="p-count" style="font-size:12px"></span>
            </div>
          </div>
          <div>
            <label for="p-privacy">Qui peut voir cette vidéo ?</label>
            <select id="p-privacy" required>
              <option value="" selected disabled>Choisir…</option>
              ${creator.privacy_level_options
                .map((p) => `<option value="${p}">${PRIVACY[p] ?? p}</option>`)
                .join("")}
            </select>
          </div>
          <div>
            <label>Autoriser les utilisateurs à :</label>
            <div class="checks">
              <label><input type="checkbox" id="p-comment" ${off(creator.comment_disabled)}> Commenter</label>
              <label><input type="checkbox" id="p-duet" ${off(creator.duet_disabled)}> Duo</label>
              <label><input type="checkbox" id="p-stitch" ${off(creator.stitch_disabled)}> Collage</label>
            </div>
            ${
              creator.comment_disabled ||
              creator.duet_disabled ||
              creator.stitch_disabled
                ? `<p class="legal" style="margin:6px 0 0">Les options grisées sont désactivées dans les réglages de votre compte TikTok.</p>`
                : ""
            }
          </div>
          <div>
            <label class="switch"><input type="checkbox" id="p-commercial"> Divulguer le contenu commercial</label>
            <p class="legal" style="margin:4px 0 0">Indiquez si cette vidéo fait la promotion de vous-même, d'une marque, d'un produit ou d'un service.</p>
            <div class="checks" id="p-kinds" hidden style="margin-top:8px">
              <label><input type="checkbox" id="p-yours"> Votre marque</label>
              <label><input type="checkbox" id="p-branded"> Contenu de marque</label>
            </div>
            <p class="legal" id="p-label" style="margin:6px 0 0"></p>
          </div>
          <p class="legal" id="p-consent"></p>
          <p class="notice" id="p-error" hidden style="margin:0"></p>
          <div class="row" style="justify-content:flex-end">
            <button value="cancel" class="ghost" id="p-cancel">Annuler</button>
            <button type="button" class="orange" id="p-send" disabled>Publier</button>
          </div>`

        const caption = $("p-caption")
        caption.value = row.caption
        const count = () =>
          ($("p-count").textContent = `${caption.value.length} / 2200`)
        caption.oninput = count
        count()

        function refresh() {
          const commercial = $("p-commercial").checked
          $("p-kinds").hidden = !commercial
          const yours = commercial && $("p-yours").checked
          const branded = commercial && $("p-branded").checked
          // Branded content cannot be private.
          const selfOnly = $("p-privacy").querySelector(
            'option[value="SELF_ONLY"]'
          )
          if (selfOnly) {
            selfOnly.disabled = branded
            if (branded && $("p-privacy").value === "SELF_ONLY")
              $("p-privacy").value = ""
          }
          $("p-label").textContent = branded
            ? "Votre vidéo sera étiquetée « Partenariat rémunéré »."
            : yours
              ? "Votre vidéo sera étiquetée « Contenu promotionnel »."
              : commercial
                ? "Choisissez au moins une option pour continuer."
                : ""
          $("p-consent").innerHTML = branded
            ? `En publiant, vous acceptez la <a href="${BRANDED}" target="_blank">Politique relative au contenu de marque</a> et la <a href="${MUSIC}" target="_blank">Confirmation d'utilisation de la musique</a> de TikTok.`
            : `En publiant, vous acceptez la <a href="${MUSIC}" target="_blank">Confirmation d'utilisation de la musique</a> de TikTok.`
          $("p-send").disabled =
            !$("p-privacy").value || (commercial && !yours && !branded)
        }
        for (const id of ["p-privacy", "p-commercial", "p-yours", "p-branded"])
          $(id).onchange = refresh
        refresh()

        $("p-send").onclick = async () => {
          $("p-send").disabled = true
          $("p-cancel").disabled = true
          $("p-send").textContent = "Envoi en cours… (1 à 3 min)"
          $("p-error").hidden = true
          try {
            const result = await call("/api/post", {
              lot,
              file: row.file,
              caption: caption.value,
              privacy: $("p-privacy").value,
              allowComment: $("p-comment").checked,
              allowDuet: $("p-duet").checked,
              allowStitch: $("p-stitch").checked,
              yourBrand: $("p-commercial").checked && $("p-yours").checked,
              brandedContent:
                $("p-commercial").checked && $("p-branded").checked,
            })
            dialog.close()
            toast(
              result.status === "PUBLISH_COMPLETE"
                ? "Publiée : elle peut mettre quelques minutes à apparaître sur votre profil"
                : "Envoyée : TikTok la traite encore, elle apparaîtra sous peu"
            )
            renderLot(lot)
          } catch (error) {
            $("p-error").hidden = false
            $("p-error").textContent = `Échec : ${error.message}`
            $("p-send").textContent = "Réessayer"
            $("p-cancel").disabled = false
            refresh()
          }
        }
      }

      async function load() {
        const state = await call("/api/state")
        renderAccount(state)
        const select = $("lot")
        select.innerHTML = state.lots
          .map(
            (lot) =>
              `<option value="${lot}">${lot.replace("lot-", "Lot du ")}</option>`
          )
          .join("")
        if (!state.lots.length) {
          $("videos").innerHTML =
            `<p class="notice">Aucun lot de vidéos pour l'instant.</p>`
          return
        }
        // The batch in progress: the latest one already started, else the next.
        const today = new Date().toISOString().slice(0, 10)
        const started = state.lots.filter((lot) => lot.slice(4) <= today)
        select.value = started[0] ?? state.lots.at(-1)
        select.onchange = () => renderLot(select.value)
        renderLot(select.value)
      }

      load().catch((error) => toast(error.message))
    </script>
  </body>
</html>
